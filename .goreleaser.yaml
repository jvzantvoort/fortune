version: 2

builds:
  - id: fortune
    main: ./cmd/fortune
    binary: fortune
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
  - id: fortune-server
    main: ./cmd/fortune-server
    binary: fortune-server
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

# SPDX SBOM for every archive, generated with syft.
sboms:
  - artifacts: archive

# Container image for fortune-server, built with ko: no Dockerfile or Docker
# daemon needed. ko uses a distroless base, runs as non-root and attaches an
# SPDX SBOM to the image.
kos:
  - build: fortune-server
    repositories:
      - ghcr.io/jvzantvoort/fortune-server
    bare: true
    tags:
      - "{{ .Version }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
    sbom: spdx
    labels:
      org.opencontainers.image.title: fortune-server
      org.opencontainers.image.description: "Fortune cookies over HTTP"
      org.opencontainers.image.source: "{{ .GitURL }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.licenses: MIT
